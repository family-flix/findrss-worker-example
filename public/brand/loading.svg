<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="findrss-loading-title findrss-loading-desc">
  <title id="findrss-loading-title">FindRSS loading</title>
  <desc id="findrss-loading-desc">The RSS dot lights up, followed by the signal arc. The F and blue tile stay still.</desc>
  <style>
    .findrss-dot { animation: findrss-dot 1.8s ease-in-out infinite; }
    .findrss-signal { animation: findrss-signal 1.8s ease-in-out infinite; }
    @keyframes findrss-dot{0%,68%,100%{opacity:.5}18%,38%{opacity:1}}
    @keyframes findrss-signal{0%,18%,82%,100%{opacity:.28}42%,58%{opacity:1}}
    @media (prefers-reduced-motion: reduce) {
      .findrss-dot, .findrss-signal { animation: none; }
    }
  </style>
  <path fill="#2563EB" d="M512 100c172 0 258 0 321 31 27 13 47 33 60 60 31 63 31 149 31 321s0 258-31 321c-13 27-33 47-60 60-63 31-149 31-321 31s-258 0-321-31c-27-13-47-33-60-60-31-63-31-149-31-321s0-258 31-321c13-27 33-47 60-60 63-31 149-31 321-31Z"/>
  <g fill="#FFFFFF" transform="translate(138.88 151.91) scale(1.5) rotate(4 256 256)">
    <path d="M116 365 L116 148 C116 108 138 88 177 88 L318 88 C340 88 354 101 354 122 C354 143 340 156 318 156 L224 156 C202 156 184 174 184 196 L184 365 C184 389 171 403 150 403 C129 403 116 389 116 365 Z"/>
    <path class="findrss-signal" transform="translate(22 0)" d="M229 191 C321 191 396 266 396 358 C396 378 384 390 365 390 C346 390 334 378 334 358 C334 300 287 253 229 253 C209 253 197 241 197 222 C197 203 209 191 229 191 Z"/>
    <circle class="findrss-dot" cx="270" cy="350" r="46"/>
  </g>
</svg>
